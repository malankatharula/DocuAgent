<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DocuAgent</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <div class="container">

    <header>
      <h1>📄 DocuAgent</h1>
      <p>Upload a document — AI extracts everything instantly</p>
    </header>

    <div class="upload-box" id="uploadBox">
      <div class="upload-icon">⬆️</div>
      <p>Drag & drop your file here</p>
      <span>or</span>
      <label for="fileInput" class="browse-btn">Browse File</label>
      <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" hidden />
      <p class="file-types">Supports PDF, PNG, JPG</p>
    </div>

    <div class="file-info" id="fileInfo" style="display:none;">
      <span id="fileName"></span>
      <button id="clearBtn">✕</button>
    </div>

    <button class="extract-btn" id="extractBtn" disabled>
      Extract Document
    </button>

    <div class="loader" id="loader" style="display:none;">
      <div class="spinner"></div>
      <p>Analyzing document...</p>
    </div>

    <div class="results" id="results" style="display:none;">

      <div class="result-header">
        <h2>Extraction Results</h2>
        <span class="badge" id="docType"></span>
        <span class="confidence" id="confidence"></span>
      </div>

      <div class="card">
        <h3>📋 Summary</h3>
        <p id="summary"></p>
      </div>

      <div class="card">
        <h3>🔑 Key Fields</h3>
        <div id="keyFields"></div>
      </div>

      <div class="card anomalies" id="anomalyCard" style="display:none;">
        <h3>⚠️ Anomalies</h3>
        <ul id="anomalies"></ul>
      </div>

    </div>
    <div class="export-buttons" id="exportButtons" style="display:none;">
    <button id="exportExcel">⬇ Download Excel</button>
    <button id="exportPdf">⬇ Download PDF Report</button>
</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
